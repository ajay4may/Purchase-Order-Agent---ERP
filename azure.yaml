# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.4"
name: foundry-document-parser
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        model:
          format: OpenAI
          name: ${AZURE_AI_MODEL_NAME}
          version: ${AZURE_AI_MODEL_VERSION}
        sku:
          name: ${AZURE_AI_MODEL_SKU}
          capacity: 10
  foundry-document-parser:
    host: azure.ai.agent
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_12
      entryPoint: app/main.py
    uses:
      - ai-project
    kind: hosted
    name: foundry-document-parser
    displayName: Foundry Order Document Parser
    description: Stateless schema-valid parsing for one uploaded order document.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: DOCUMENT_INTELLIGENCE_ENDPOINT
        value: ${DOCUMENT_INTELLIGENCE_ENDPOINT}
      - name: MAX_FILE_SIZE_BYTES
        value: ${MAX_FILE_SIZE_BYTES}
    container:
      resources:
        cpu: "1"
        memory: 2Gi
infra:
  provider: microsoft.foundry
